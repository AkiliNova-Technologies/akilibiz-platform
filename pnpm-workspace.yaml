packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
allowBuilds:
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  esbuild: true
  prisma: set this to true or false
  unrs-resolver: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
fetchTimeout: 120000
fetchRetries: 5
networkConcurrency: 1
