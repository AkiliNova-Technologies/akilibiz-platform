name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.4.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @akilibiz/business-web db:validate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/akilibiz
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/akilibiz
      - run: pnpm --filter @akilibiz/business-web db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
